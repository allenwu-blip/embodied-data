[project]
name = "embodied-data"
version = "0.3.1"
description = "Bidirectional converter and validator for AgiBot World ↔ LeRobot v3 datasets."
readme = "README.md"
authors = [
    { name = "Tong", email = "allenwu@umich.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.8",
    "h5py>=3.11",
    "pyarrow>=17",
    "av>=13",
    "huggingface-hub>=0.24",
    "numpy>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
embodied-data = "embodied_data.cli:app"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
