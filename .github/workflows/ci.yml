name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies (frozen)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest with coverage
        run: uv run pytest -q --cov=embodied_data --cov-report=term-missing

      - name: Version-tag drift check (always print, strict on tag pushes)
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            uv run python scripts/check_version.py --strict
          else
            uv run python scripts/check_version.py
          fi
